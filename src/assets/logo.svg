<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <defs>
        <linearGradient id="skin" x1="32" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#4fd9d2" />
            <stop offset="1" stop-color="#20b0ac" />
        </linearGradient>
        <linearGradient id="snout" x1="32" y1="0" x2="32" y2="40" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#8aeee0" />
            <stop offset="1" stop-color="#3accc6" />
        </linearGradient>
        <linearGradient id="mouth" x1="32" y1="34" x2="32" y2="58" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#f3b84a" />
            <stop offset="1" stop-color="#cf6a3a" />
        </linearGradient>
    </defs>
    <rect width="64" height="64" fill="url(#skin)" />
    <!-- open mouth — large enough to read at 26px -->
    <ellipse cx="32" cy="48" rx="22" ry="13" fill="url(#mouth)" />
    <!-- snout -->
    <path
        fill="url(#snout)"
        d="M4 30c0-15.5 11-28 28-28s28 12.5 28 28c0 8.8-5.6 15.2-13.8 18.4C42.4 50 37.4 51 32 51s-10.4-1-14.2-2.6C9.6 45.2 4 38.8 4 30Z"
    />
    <!-- lower lip -->
    <path
        fill="#1fa7a4"
        d="M8 50c4.8 8.4 13.4 14 24 14s19.2-5.6 24-14c-5 5.6-13.8 9.2-24 9.2S13 55.6 8 50Z"
    />
    <!-- nostrils -->
    <ellipse cx="23.5" cy="29" rx="5.4" ry="7" fill="#0b3c40" />
    <ellipse cx="40.5" cy="29" rx="5.4" ry="7" fill="#0b3c40" />
    <ellipse cx="24.8" cy="26.8" rx="1.9" ry="2.6" fill="#3a7a7e" />
    <ellipse cx="41.8" cy="26.8" rx="1.9" ry="2.6" fill="#3a7a7e" />
    <!-- fangs -->
    <path fill="#fff" d="M15.8 41.2 20.2 52.5 25 40.6a28 28 0 0 0-9.2.6Z" />
    <path fill="#fff" d="M39 40.6 43.8 52.5 48.2 41.2a28 28 0 0 0-9.2-.6Z" />
</svg>
