<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Garia</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="app-shell">
            <!-- ── Sidebar ──────────────────────────────────────────────── -->
            <aside class="sidebar">
                <div class="sidebar-header" data-tauri-drag-region>
                    <svg
                        class="logo-mark"
                        viewBox="0 0 24 24"
                        width="26"
                        height="26"
                        aria-hidden="true"
                    >
                        <!-- meteor: flame tongues trailing up-left, core lower-right -->
                        <path
                            d="M13.49 12.24 Q8.30 9.71 5.96 10.80 Q6.55 13.31 11.74 15.84 Z"
                            fill="currentColor"
                        />
                        <path
                            d="M15.66 11.82 Q13.37 7.13 11.24 6.86 Q10.13 8.71 12.42 13.40 Z"
                            fill="currentColor"
                        />
                        <!-- lead tongue picks up the accent, as the dragon's crest did -->
                        <path
                            d="M15.05 11.37 Q9.80 6.12 5.85 5.85 Q6.12 9.80 11.37 15.05 Z"
                            fill="var(--accent)"
                        />
                        <circle cx="15.4" cy="15.4" r="4.5" fill="currentColor" />
                    </svg>
                    <div class="wordmark">
                        <span class="wordmark-a">gar</span><span
                            class="wordmark-b"
                            >ia</span
                        >
                    </div>
                    <button
                        class="panel-toggle"
                        id="sidebar-toggle"
                        title="Hide sidebar"
                        aria-label="Hide sidebar"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="16"
                            height="16"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.75"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <rect x="3" y="3" width="18" height="18" rx="2" />
                            <line x1="9" y1="3" x2="9" y2="21" />
                        </svg>
                    </button>
                </div>

                <button id="open-modal-btn" class="btn-primary add-btn">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="15"
                        height="15"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.25"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <line x1="12" y1="5" x2="12" y2="19" />
                        <line x1="5" y1="12" x2="19" y2="12" />
                    </svg>
                    Add download
                </button>

                <nav class="sidebar-nav" id="filter-bar">
                    <div class="nav-group">
                        <div class="nav-group-label">Library</div>
                        <button class="nav-item active" data-filter="all">
                            <svg
                                class="nav-icon"
                                xmlns="http://www.w3.org/2000/svg"
                                width="16"
                                height="16"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.75"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <polyline points="22 12 16 12 14 15 10 15 8 12 2 12" />
                                <path
                                    d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"
                                />
                            </svg>
                            <span class="nav-label">All Downloads</span>
                            <span class="nav-count hidden" data-count="all"></span>
                        </button>
                        <button class="nav-item" data-filter="active">
                            <svg
                                class="nav-icon"
                                xmlns="http://www.w3.org/2000/svg"
                                width="16"
                                height="16"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.75"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <circle cx="12" cy="12" r="9" />
                                <polyline points="8 12 12 16 16 12" />
                                <line x1="12" y1="8" x2="12" y2="16" />
                            </svg>
                            <span class="nav-label">Downloading</span>
                            <span
                                class="nav-count hidden"
                                data-count="active"
                            ></span>
                        </button>
                        <button class="nav-item" data-filter="waiting">
                            <svg
                                class="nav-icon"
                                xmlns="http://www.w3.org/2000/svg"
                                width="16"
                                height="16"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.75"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <circle cx="12" cy="12" r="9" />
                                <polyline points="12 7 12 12 15.5 14" />
                            </svg>
                            <span class="nav-label">Queued</span>
                            <span
                                class="nav-count hidden"
                                data-count="waiting"
                            ></span>
                        </button>
                        <button class="nav-item" data-filter="paused">
                            <svg
                                class="nav-icon"
                                xmlns="http://www.w3.org/2000/svg"
                                width="16"
                                height="16"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.75"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <circle cx="12" cy="12" r="9" />
                                <line x1="10" y1="9" x2="10" y2="15" />
                                <line x1="14" y1="9" x2="14" y2="15" />
                            </svg>
                            <span class="nav-label">Paused</span>
                            <span
                                class="nav-count hidden"
                                data-count="paused"
                            ></span>
                        </button>
                    </div>

                    <div class="nav-group">
                        <div class="nav-group-label">Archive</div>
                        <button class="nav-item" data-filter="complete">
                            <svg
                                class="nav-icon"
                                xmlns="http://www.w3.org/2000/svg"
                                width="16"
                                height="16"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.75"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <circle cx="12" cy="12" r="9" />
                                <polyline points="8.5 12.5 11 15 15.5 9.5" />
                            </svg>
                            <span class="nav-label">Completed</span>
                            <span
                                class="nav-count hidden"
                                data-count="complete"
                            ></span>
                        </button>
                        <button class="nav-item" data-filter="error">
                            <svg
                                class="nav-icon"
                                xmlns="http://www.w3.org/2000/svg"
                                width="16"
                                height="16"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.75"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <circle cx="12" cy="12" r="9" />
                                <line x1="12" y1="7.5" x2="12" y2="13" />
                                <line x1="12" y1="16.5" x2="12.01" y2="16.5" />
                            </svg>
                            <span class="nav-label">Failed</span>
                            <span
                                class="nav-count hidden"
                                data-count="error"
                            ></span>
                        </button>
                    </div>
                </nav>
            </aside>

            <!-- ── Main content ─────────────────────────────────────────── -->
            <main class="content">
                <header class="content-header" data-tauri-drag-region>
                    <button
                        class="panel-toggle content-panel-toggle"
                        id="sidebar-show"
                        title="Show sidebar"
                        aria-label="Show sidebar"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="16"
                            height="16"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.75"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <rect x="3" y="3" width="18" height="18" rx="2" />
                            <line x1="9" y1="3" x2="9" y2="21" />
                        </svg>
                    </button>
                    <div class="content-title">
                        <h1 id="view-title">All Downloads</h1>
                        <span id="view-count" class="view-count"></span>
                    </div>
                    <div class="content-actions">
                        <button class="pill" id="pause-all" title="Pause all">
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="13"
                                height="13"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <line x1="9" y1="5" x2="9" y2="19" />
                                <line x1="15" y1="5" x2="15" y2="19" />
                            </svg>
                            Pause all
                        </button>
                        <button class="pill" id="resume-all" title="Resume all">
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="13"
                                height="13"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <polygon points="6 4 20 12 6 20 6 4" />
                            </svg>
                            Resume all
                        </button>
                        <div class="search-field">
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="13"
                                height="13"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2.25"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <circle cx="11" cy="11" r="8" />
                                <line x1="21" y1="21" x2="16.65" y2="16.65" />
                            </svg>
                            <input
                                id="name-filter"
                                class="name-filter"
                                type="search"
                                placeholder="Search downloads…"
                            />
                        </div>
                    </div>
                </header>

                <div class="content-body">
                    <ul id="download-list"></ul>
                    <div id="empty-state" class="empty-state hidden">
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="34"
                            height="34"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.25"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path
                                d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"
                            />
                            <polyline points="17 8 12 3 7 8" />
                            <line x1="12" y1="3" x2="12" y2="15" />
                        </svg>
                        <p class="empty-title" id="empty-title">
                            No downloads yet
                        </p>
                        <p class="empty-sub" id="empty-sub">
                            Drag a URL or .torrent file anywhere, or hit Add
                            download
                        </p>
                    </div>
                </div>
            </main>

            <!-- ── Status bar ───────────────────────────────────────────── -->
            <footer class="statusbar">
                <span id="conn-dot" class="conn-dot conn-waiting"></span>
                <span id="conn-text">Connecting…</span>
                <span class="status-sep">·</span>
                <span id="stat-counts">no downloads</span>
                <span id="stat-speed" class="status-right"></span>
                <span class="kbd-hint"><kbd>&#8984;F</kbd> search</span>
            </footer>
        </div>

        <!-- ── Add download modal ───────────────────────────────────────── -->
        <div
            id="modal-overlay"
            class="modal-overlay hidden"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modal-title"
        >
            <div class="modal">
                <div class="modal-header">
                    <h2 id="modal-title">Add download</h2>
                    <button
                        class="modal-close"
                        id="modal-close"
                        aria-label="Close"
                    >
                        ✕
                    </button>
                </div>
                <div class="modal-body">
                    <label class="modal-label" for="modal-url-input"
                        >Enter URL or choose torrent file</label
                    >
                    <div class="modal-input-row">
                        <input
                            id="modal-url-input"
                            type="url"
                            placeholder="https://…"
                            autocomplete="off"
                            spellcheck="false"
                        />
                        <button class="btn-secondary" id="browse-btn">
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="14"
                                height="14"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path
                                    d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"
                                />
                            </svg>
                            Browse…
                        </button>
                        <!-- hidden file input for torrent picker -->
                        <input
                            id="torrent-file-input"
                            type="file"
                            accept=".torrent"
                            class="hidden"
                        />
                    </div>
                    <p id="modal-error" class="error hidden"></p>
                </div>
                <div class="modal-footer">
                    <button class="btn-secondary" id="modal-cancel">
                        Cancel
                    </button>
                    <button class="btn-primary" id="modal-ok">OK</button>
                </div>
            </div>
        </div>

        <!-- ── Delete confirmation ──────────────────────────────────────── -->
        <div
            id="confirm-overlay"
            class="modal-overlay hidden"
            role="dialog"
            aria-modal="true"
            aria-labelledby="confirm-title"
        >
            <div class="modal modal-sm">
                <div class="modal-header">
                    <h2 id="confirm-title">Delete download</h2>
                </div>
                <div class="modal-body">
                    <p class="confirm-text">
                        Remove
                        <span id="confirm-name" class="confirm-name"></span>
                        from the list?
                    </p>
                    <label class="confirm-check hidden" id="confirm-file-row">
                        <input type="checkbox" id="confirm-trash" />
                        <span>Move the downloaded file to the Trash</span>
                    </label>
                </div>
                <div class="modal-footer">
                    <button class="btn-secondary" id="confirm-cancel">
                        Cancel
                    </button>
                    <button class="btn-danger" id="confirm-delete">Delete</button>
                </div>
            </div>
        </div>

        <!-- ── Full-window drag overlay ─────────────────────────────────── -->
        <div id="drop-overlay" class="drop-overlay hidden">
            <div class="drop-frame">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="38"
                    height="38"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.25"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="17 8 12 3 7 8" />
                    <line x1="12" y1="3" x2="12" y2="15" />
                </svg>
                <span>Drop to download</span>
            </div>
        </div>

        <script type="module" src="main.js"></script>
    </body>
</html>
