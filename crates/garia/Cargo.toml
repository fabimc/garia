[package]
name = "garia-app"
version = "0.2.0"
description = "Garia iced binary (coexists with the Tauri package)"
edition.workspace = true
license.workspace = true

[[bin]]
name = "garia-app"
path = "src/main.rs"

[dependencies]
garia-core = { path = "../garia-core" }
garia-platform = { path = "../garia-platform" }
garia-ui = { path = "../garia-ui" }
dirs = "5"
iced = { version = "0.13", default-features = false, features = [
    "tiny-skia",
    "tokio",
] }
