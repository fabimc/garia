name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            pkg-config \
            zlib1g-dev \
            python3 \
            dpkg-dev

      - name: Build Linux sidecars
        run: ./scripts/sidecar.sh

      - name: Build garia (release)
        run: cargo build --release -p garia

      - name: Stage tarball
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          STAGE="dist/garia-${VER}-linux-x86_64"
          mkdir -p "$STAGE"
          cp target/release/garia "$STAGE/"
          TRIPLE="$(rustc -vV | awk '/^host:/{print $2}')"
          cp "binaries/aria2c-${TRIPLE}" "$STAGE/aria2c"
          cp "binaries/ffmpeg-${TRIPLE}" "$STAGE/ffmpeg"
          cp resources/yt-dlp "$STAGE/yt-dlp"
          chmod +x "$STAGE"/*
          cp packaging/garia.desktop "$STAGE/"
          cp packaging/README.md "$STAGE/PACKAGING.md"
          tar -C dist -czf "dist/garia-${VER}-linux-x86_64.tar.gz" "garia-${VER}-linux-x86_64"
          (
            cd "$STAGE"
            sha256sum garia aria2c ffmpeg yt-dlp > "../garia-${VER}-linux-x86_64.SHA256SUMS"
          )

      - name: Build .deb
        run: ./scripts/pack-linux-deb.sh --version "${GITHUB_REF_NAME#v}" --out dist

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./scripts/pack-linux-appimage.sh --version "${GITHUB_REF_NAME#v}" --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            dist/garia-*-linux-x86_64.tar.gz
            dist/garia-*-linux-x86_64.SHA256SUMS
            dist/garia_*_amd64.deb
            dist/garia_*_amd64.deb.SHA256SUMS
            dist/Garia-*-x86_64.AppImage
            dist/Garia-*-x86_64.AppImage.SHA256SUMS
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build universal sidecars
        run: ./scripts/sidecar.sh universal-apple-darwin

      - name: Build garia (aarch64 + x86_64)
        run: |
          set -euo pipefail
          cargo build --release -p garia --target aarch64-apple-darwin
          cargo build --release -p garia --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create \
            target/aarch64-apple-darwin/release/garia \
            target/x86_64-apple-darwin/release/garia \
            -output target/universal/garia

      - name: Stage tarball
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          STAGE="dist/garia-${VER}-macos-universal"
          mkdir -p "$STAGE"
          cp target/universal/garia "$STAGE/"
          cp binaries/aria2c-universal-apple-darwin "$STAGE/aria2c"
          cp binaries/ffmpeg-universal-apple-darwin "$STAGE/ffmpeg"
          cp resources/yt-dlp "$STAGE/yt-dlp"
          chmod +x "$STAGE"/*
          cp packaging/Info.plist "$STAGE/"
          cp packaging/entitlements.plist "$STAGE/"
          cp packaging/README.md "$STAGE/PACKAGING.md"
          tar -C dist -czf "dist/garia-${VER}-macos-universal.tar.gz" "garia-${VER}-macos-universal"
          (
            cd "$STAGE"
            shasum -a 256 garia aria2c ffmpeg yt-dlp > "../garia-${VER}-macos-universal.SHA256SUMS"
          )

      # Empty Apple secrets are still "set"; only publish ones with a value so
      # codesign / notarytool are skipped cleanly when unsigned.
      - name: Configure Apple signing when secrets exist
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          publish() {
            if [ -n "$2" ]; then
              {
                echo "$1<<EOF"
                echo "$2"
                echo "EOF"
              } >> "$GITHUB_ENV"
            fi
          }
          publish APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
          publish APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
          publish APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
          publish APPLE_ID "$APPLE_ID"
          publish APPLE_PASSWORD "$APPLE_PASSWORD"
          publish APPLE_TEAM_ID "$APPLE_TEAM_ID"
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple certificate secret; DMG will be unsigned."
          fi

      - name: Build .app + DMG (universal)
        run: ./scripts/pack-macos.sh --version "${GITHUB_REF_NAME#v}" --binary target/universal/garia --arch-label universal --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            dist/garia-*-macos-universal.tar.gz
            dist/garia-*-macos-universal.SHA256SUMS
            dist/Garia_*_universal.dmg
            dist/Garia_universal.app.tar.gz
            dist/Garia_*_universal.SHA256SUMS
          if-no-files-found: error

  # One draft release with all platform artifacts (avoids parallel softprops races).
  publish:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload combined draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Garia ${{ github.ref_name }}
          draft: true
          files: |
            dist/garia-*-linux-x86_64.tar.gz
            dist/garia-*-linux-x86_64.SHA256SUMS
            dist/garia_*_amd64.deb
            dist/garia_*_amd64.deb.SHA256SUMS
            dist/Garia-*-x86_64.AppImage
            dist/Garia-*-x86_64.AppImage.SHA256SUMS
            dist/garia-*-macos-universal.tar.gz
            dist/garia-*-macos-universal.SHA256SUMS
            dist/Garia_*_universal.dmg
            dist/Garia_universal.app.tar.gz
            dist/Garia_*_universal.SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
