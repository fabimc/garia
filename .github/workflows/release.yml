name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            zlib1g-dev \
            python3

      - name: Build Linux sidecars
        run: ./scripts/sidecar.sh

      - name: Build garia (release)
        run: cargo build --release -p garia

      - name: Stage artifact
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          STAGE="dist/garia-${VER}-linux-x86_64"
          mkdir -p "$STAGE"
          cp target/release/garia "$STAGE/"
          TRIPLE="$(rustc -vV | awk '/^host:/{print $2}')"
          cp "binaries/aria2c-${TRIPLE}" "$STAGE/aria2c"
          cp "binaries/ffmpeg-${TRIPLE}" "$STAGE/ffmpeg"
          cp resources/yt-dlp "$STAGE/yt-dlp"
          chmod +x "$STAGE"/*
          cp packaging/garia.desktop "$STAGE/"
          cp packaging/README.md "$STAGE/PACKAGING.md"
          tar -C dist -czf "dist/garia-${VER}-linux-x86_64.tar.gz" "garia-${VER}-linux-x86_64"
          (
            cd "$STAGE"
            sha256sum garia aria2c ffmpeg yt-dlp > "../garia-${VER}-linux-x86_64.SHA256SUMS"
          )

      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            dist/garia-*-linux-x86_64.tar.gz
            dist/garia-*-linux-x86_64.SHA256SUMS
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build universal sidecars
        run: ./scripts/sidecar.sh universal-apple-darwin

      - name: Build garia (aarch64 + x86_64)
        run: |
          set -euo pipefail
          cargo build --release -p garia --target aarch64-apple-darwin
          cargo build --release -p garia --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create \
            target/aarch64-apple-darwin/release/garia \
            target/x86_64-apple-darwin/release/garia \
            -output target/universal/garia

      - name: Stage artifact
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          STAGE="dist/garia-${VER}-macos-universal"
          mkdir -p "$STAGE"
          cp target/universal/garia "$STAGE/"
          cp binaries/aria2c-universal-apple-darwin "$STAGE/aria2c"
          cp binaries/ffmpeg-universal-apple-darwin "$STAGE/ffmpeg"
          cp resources/yt-dlp "$STAGE/yt-dlp"
          chmod +x "$STAGE"/*
          cp packaging/Info.plist "$STAGE/"
          cp packaging/entitlements.plist "$STAGE/"
          cp packaging/README.md "$STAGE/PACKAGING.md"
          tar -C dist -czf "dist/garia-${VER}-macos-universal.tar.gz" "garia-${VER}-macos-universal"
          (
            cd "$STAGE"
            shasum -a 256 garia aria2c ffmpeg yt-dlp > "../garia-${VER}-macos-universal.SHA256SUMS"
          )

      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            dist/garia-*-macos-universal.tar.gz
            dist/garia-*-macos-universal.SHA256SUMS
          if-no-files-found: error

  # One draft release with both platform tarballs (avoids parallel softprops races).
  publish:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload combined draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Garia ${{ github.ref_name }}
          draft: true
          files: |
            dist/garia-*-linux-x86_64.tar.gz
            dist/garia-*-linux-x86_64.SHA256SUMS
            dist/garia-*-macos-universal.tar.gz
            dist/garia-*-macos-universal.SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
